<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>가계부</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ========== HEADER ========== -->
  <header class="app-header">
    <button class="header-btn" id="btn-back" onclick="App.goBack()" style="display:none">← 뒤로</button>
    <h1 class="header-title" id="header-title">가계부</h1>
    <span class="header-user" id="header-user"></span>
  </header>

  <!-- ========== SCREEN: 최초 설정 ========== -->
  <section class="screen" id="screen-setup">
    <div class="screen-content centered">
      <div class="setup-card">
        <div class="setup-icon">📒</div>
        <h2>가계부</h2>
        <p>처음 사용하시나요? 이름을 입력해주세요</p>
        <input type="text" id="setup-name" class="form-input" placeholder="이름 (예: 김복지)" maxlength="20"
               onkeydown="if(event.key==='Enter') App.setup()">
        <button class="btn btn-primary btn-full" onclick="App.setup()">시작하기</button>
      </div>
    </div>
  </section>

  <!-- ========== SCREEN: 담당 인원 선택 ========== -->
  <section class="screen" id="screen-select">
    <div class="screen-content">
      <div class="section-header">
        <h2>담당 인원</h2>
        <button class="btn btn-sm btn-outline" onclick="App.showScreen('admin')">⚙ 관리</button>
      </div>
      <div class="search-bar">
        <input type="text" id="search-resident" class="form-input" placeholder="🔍 이름 검색"
               oninput="App.filterResidents(this.value)">
      </div>
      <div id="resident-list" class="resident-list"></div>
      <div class="empty-state" id="no-residents" style="display:none">
        <div class="empty-icon">👤</div>
        <p>등록된 인원이 없습니다</p>
        <button class="btn btn-primary" onclick="App.showScreen('admin')">인원 등록하기</button>
      </div>
    </div>
  </section>

  <!-- ========== SCREEN: 가계부 홈 ========== -->
  <section class="screen" id="screen-home">
    <div class="screen-content">
      <!-- 월 이동 -->
      <div class="month-nav">
        <button class="btn btn-icon" onclick="App.prevMonth()">&#8592;</button>
        <span id="home-month-label" class="month-label"></span>
        <button class="btn btn-icon" onclick="App.nextMonth()">&#8594;</button>
      </div>
      <!-- 요약 카드 -->
      <div class="summary-card">
        <div class="summary-row">
          <span class="summary-label">수입</span>
          <span class="summary-amount income" id="home-income">₩0</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">지출</span>
          <span class="summary-amount expense" id="home-expense">₩0</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-row">
          <span class="summary-label bold">잔액</span>
          <span class="summary-amount bold" id="home-balance">₩0</span>
        </div>
      </div>
      <!-- 카테고리 요약 -->
      <div class="card" id="home-categories" style="display:none"></div>
      <!-- 최근 내역 -->
      <div class="section-header" style="margin-top:16px">
        <h3>최근 내역</h3>
        <button class="btn btn-sm btn-text" onclick="App.showScreen('list')">전체보기</button>
      </div>
      <div id="home-recent" class="item-list"></div>
      <!-- 엑셀 저장 -->
      <div style="margin-top:16px">
        <button class="btn btn-success btn-full" onclick="Excel.exportMonth()">
          📊 이달 내역 엑셀 저장 / 인쇄
        </button>
      </div>
    </div>
    <!-- 하단 입력 버튼 (홈에서만 표시) -->
    <div class="bottom-actions">
      <button class="btn-action" onclick="App.showAddIncome()">
        <span>💵</span><span>수입</span>
      </button>
      <button class="btn-action btn-action-primary" onclick="App.showAddExpense('manual')">
        <span>✏️</span><span>직접입력</span>
      </button>
      <button class="btn-action" onclick="App.showAddExpense('photo')">
        <span>📷</span><span>영수증</span>
      </button>
      <button class="btn-action" onclick="App.showScanner()">
        <span>📱</span><span>QR/스캔</span>
      </button>
    </div>
  </section>

  <!-- ========== SCREEN: 지출 추가/수정 ========== -->
  <section class="screen" id="screen-expense">
    <div class="screen-content">
      <!-- 영수증 이미지 미리보기 -->
      <div id="receipt-preview-area" style="display:none" class="card" style="padding:12px">
        <img id="receipt-img" class="receipt-preview" alt="영수증">
        <p class="hint-text">이미지를 보며 아래 내용을 입력해주세요</p>
      </div>
      <!-- 지출 입력 폼 -->
      <form id="expense-form" onsubmit="App.saveExpense(event)">
        <input type="hidden" id="expense-id">
        <div class="form-group">
          <label class="form-label">날짜 *</label>
          <input type="date" id="expense-date" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">상호명 *</label>
          <input type="text" id="expense-store" class="form-input"
                 placeholder="예: 이마트, 카카오T" required maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label">금액 (원) *</label>
          <input type="number" id="expense-amount" class="form-input"
                 placeholder="0" min="0" max="99999999" required>
        </div>
        <div class="form-group">
          <label class="form-label">카테고리 *</label>
          <select id="expense-category" class="form-input" required>
            <option value="">선택하세요</option>
            <option value="FOOD">🍽️ 식비</option>
            <option value="TRANSPORT">🚌 교통비</option>
            <option value="HOUSING">🏠 주거/관리비</option>
            <option value="HEALTH">💊 의료/건강</option>
            <option value="EDUCATION">📚 교육</option>
            <option value="CULTURE">🎬 문화/여가</option>
            <option value="SHOPPING">🛒 쇼핑</option>
            <option value="FINANCE">💰 금융</option>
            <option value="OTHER">📌 기타</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">결제수단</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="payment" value="카드" checked> 카드</label>
            <label class="radio-label"><input type="radio" name="payment" value="현금"> 현금</label>
            <label class="radio-label"><input type="radio" name="payment" value="계좌이체"> 계좌이체</label>
            <label class="radio-label"><input type="radio" name="payment" value="기타"> 기타</label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">메모</label>
          <input type="text" id="expense-memo" class="form-input" placeholder="선택 입력" maxlength="200">
        </div>
        <div class="form-actions">
          <button type="button" id="btn-delete-expense" class="btn btn-danger"
                  onclick="App.deleteExpense()" style="display:none">삭제</button>
          <button type="submit" class="btn btn-primary btn-flex">저장</button>
        </div>
      </form>
      <!-- 영수증 파일 입력 (숨김) -->
      <input type="file" id="receipt-file" accept="image/*" capture="environment"
             style="display:none" onchange="App.handleReceiptFile(this)">
    </div>
  </section>

  <!-- ========== SCREEN: 수입 추가/수정 ========== -->
  <section class="screen" id="screen-income">
    <div class="screen-content">
      <form id="income-form" onsubmit="App.saveIncome(event)">
        <input type="hidden" id="income-id">
        <div class="form-group">
          <label class="form-label">날짜 *</label>
          <input type="date" id="income-date" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">출처 *</label>
          <input type="text" id="income-source" class="form-input"
                 placeholder="예: 급여, 용돈, 지원금" required maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label">금액 (원) *</label>
          <input type="number" id="income-amount" class="form-input"
                 placeholder="0" min="0" required>
        </div>
        <div class="form-group">
          <label class="form-label">카테고리</label>
          <select id="income-category" class="form-input">
            <option value="SALARY">급여/수당</option>
            <option value="ALLOWANCE">용돈/지원금</option>
            <option value="BENEFIT">복지급여</option>
            <option value="OTHER">기타</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">메모</label>
          <input type="text" id="income-memo" class="form-input" placeholder="선택 입력" maxlength="200">
        </div>
        <div class="form-actions">
          <button type="button" id="btn-delete-income" class="btn btn-danger"
                  onclick="App.deleteIncome()" style="display:none">삭제</button>
          <button type="submit" class="btn btn-primary btn-flex">저장</button>
        </div>
      </form>
    </div>
  </section>

  <!-- ========== SCREEN: 내역 목록 ========== -->
  <section class="screen" id="screen-list">
    <div class="screen-content">
      <div class="list-filters">
        <select id="list-month-filter" class="form-input form-input-sm" onchange="App.renderList()"></select>
        <select id="list-category-filter" class="form-input form-input-sm" onchange="App.renderList()">
          <option value="">전체</option>
          <option value="FOOD">식비</option>
          <option value="TRANSPORT">교통비</option>
          <option value="HOUSING">주거/관리비</option>
          <option value="HEALTH">의료/건강</option>
          <option value="EDUCATION">교육</option>
          <option value="CULTURE">문화/여가</option>
          <option value="SHOPPING">쇼핑</option>
          <option value="FINANCE">금융</option>
          <option value="OTHER">기타</option>
        </select>
      </div>
      <div class="list-summary card" id="list-summary"></div>
      <div id="expense-list" class="item-list"></div>
      <div class="empty-state" id="no-expenses" style="display:none">
        <div class="empty-icon">📭</div>
        <p>내역이 없습니다</p>
      </div>
    </div>
  </section>

  <!-- ========== SCREEN: 관리자 ========== -->
  <section class="screen" id="screen-admin">
    <div class="screen-content">
      <div class="section-header">
        <h3>담당 인원 관리</h3>
        <button class="btn btn-sm btn-primary" onclick="App.showAddResident()">+ 추가</button>
      </div>
      <div id="admin-resident-list" class="item-list"></div>

      <div class="section-header" style="margin-top:28px">
        <h3>데이터 관리</h3>
      </div>
      <div class="data-actions">
        <button class="btn btn-outline btn-full" onclick="Excel.exportAll()">
          📊 전체 데이터 엑셀 내보내기
        </button>
        <label class="btn btn-outline btn-full" style="cursor:pointer;text-align:center">
          📂 엑셀에서 데이터 가져오기 (병합)
          <input type="file" accept=".xlsx,.xls" style="display:none"
                 onchange="Excel.importFromFile(this)">
        </label>
        <button class="btn btn-danger-outline btn-full" onclick="App.confirmClearData()">
          🗑️ 전체 데이터 초기화
        </button>
      </div>
    </div>
  </section>

  <!-- ========== MODAL: 인원 추가/수정 ========== -->
  <div class="modal-overlay" id="modal-resident" style="display:none"
       onclick="if(event.target===this) App.closeModal('resident')">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-resident-title">인원 추가</h3>
        <button class="modal-close" onclick="App.closeModal('resident')">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="resident-edit-id">
        <div class="form-group">
          <label class="form-label">이름 *</label>
          <input type="text" id="resident-name" class="form-input" placeholder="이름" maxlength="20">
        </div>
        <div class="form-group">
          <label class="form-label">팀</label>
          <input type="text" id="resident-team" class="form-input" placeholder="예: 1팀" maxlength="20">
        </div>
        <div class="form-group">
          <label class="form-label">시작일</label>
          <input type="date" id="resident-start" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">메모</label>
          <input type="text" id="resident-memo" class="form-input" placeholder="선택 입력" maxlength="100">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="App.closeModal('resident')">취소</button>
        <button class="btn btn-primary" onclick="App.saveResident()">저장</button>
      </div>
    </div>
  </div>

  <!-- ========== MODAL: QR/바코드 스캐너 ========== -->
  <div class="modal-overlay" id="modal-scanner" style="display:none">
    <div class="modal modal-scanner">
      <div class="modal-header">
        <h3>QR / 바코드 스캔</h3>
        <button class="modal-close" onclick="Scanner.stop()">✕</button>
      </div>
      <div class="scanner-container">
        <video id="scanner-video" class="scanner-video" autoplay muted playsinline></video>
        <div class="scanner-overlay">
          <div class="scanner-frame"></div>
        </div>
      </div>
      <div class="modal-body">
        <p class="hint-text" style="text-align:center">카메라가 QR코드 또는 바코드를 자동 인식합니다</p>
        <div id="scan-result" class="scan-result" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- ========== TOAST ========== -->
  <div id="toast" class="toast" style="display:none"></div>

</div><!-- #app -->

<!-- ========== 라이브러리 ========== -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.20.0-beta.3/umd/index.min.js"></script>

<!-- ========== 앱 스크립트 ========== -->
<script src="js/db.js"></script>
<script src="js/excel.js"></script>
<script src="js/scanner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
